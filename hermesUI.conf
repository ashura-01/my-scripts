#kate ~/.hermes/skins/deathknight.yaml
#hermes config set display.skin deathknight
# ~/.hermes/skins/deathknight.yaml
# Requires a Nerd Font set as your terminal font (Konsole > Edit Profile > Appearance).
# Nerd Font glyphs are written as \uXXXX escapes inside double-quoted strings so they
# survive copy/paste. Do not convert those strings to single quotes.

name: deathknight
description: Death Knight - light indigo theme with Nerd Font glyphs

colors:
  # Banner
  banner_border: "#C7CAFF"
  banner_title: "#E6E8FF"
  banner_accent: "#AEB4FF"
  banner_dim: "#7F84C9"
  banner_text: "#F2F3FF"

  # UI
  ui_accent: "#E6E8FF"
  ui_label: "#9FA4F0"
  ui_ok: "#B9E8C8"
  ui_error: "#FFB3B8"
  ui_warn: "#FFDDA8"
  prompt: "#F2F3FF"

  # Structure: faint indigo lines instead of fully hidden
  input_rule: "#2a2d6b"
  response_border: "#12131a"
  session_label: "#9FA4F0"
  session_border: "#2a2d6b"

  # Status bar
  status_bar_bg: "#0f1030"
  voice_status_bg: "#0f1030"
  status_bar_text: "#C7CAFF"
  status_bar_strong: "#8A8FE0"
  status_bar_dim: "#6F74B8"
  status_bar_good: "#B9E8C8"
  status_bar_warn: "#FFDDA8"
  status_bar_bad: "#FFB3B8"
  status_bar_critical: "#FF8A94"

  # Selection and completion menu
  selection_bg: "#2a2d6b"
  completion_menu_bg: "#0f1030"
  completion_menu_current_bg: "#2a2d6b"
  completion_menu_meta_bg: "#0f1030"
  completion_menu_meta_current_bg: "#2a2d6b"

spinner:
  waiting_faces:
    - "(\uf0e7)"   # bolt
    - "(\uf2dc)"   # snowflake
    - "(\uf219)"   # diamond
  thinking_faces:
    - "(\u2694)"   # crossed swords
    - "(\uf06e)"   # eye
    - "(\uf05b)"   # crosshairs
  thinking_verbs:
    - "reaping"
    - "executing"
    - "summoning"
    - "calculating damage"
    - "raising the dead"
    - "sharpening the blade"
    - "consulting the frost"
    - "harvesting souls"
  wings:
    - ["\u27ea\u2694", "\u2694\u27eb"]
    - ["\u27ea\uf0e7", "\uf0e7\u27eb"]

branding:
  agent_name: "Death Knight"
  welcome: "\uf0e7 Death Knight online. Type your command."
  goodbye: "\uf00c Dismissed."
  response_label: " \u2694 Death Knight "
  prompt_symbol: "\uf054"
  help_header: "\uf05a Available Commands"

tool_prefix: "\u258f"

tool_emojis:
  terminal: "\uf120"
  execute_code: "\uf121"
  process: "\uf013"
  read_file: "\uf0f6"
  write_file: "\uf044"
  patch: "\uf040"
  search_files: "\uf002"
  web_search: "\uf0ac"
  web_extract: "\uf0c1"
  browser_exec: "\uf06e"
  computer_use: "\uf108"
  skill_view: "\uf02d"
  skills_list: "\uf02d"
  skill_manage: "\uf0d0"
  memory: "\uf1c0"
  session_search: "\uf002"
  delegate_task: "\uf0c0"
  clarify: "\uf059"
  todo: "\uf046"
  cronjob: "\uf017"
  send_message: "\uf1d8"
  image_generate: "\uf03e"
  vision_analyze: "\uf030"
  manage_connections: "\uf1e0"

# Small logo replaces the big default HERMES-AGENT banner
banner_logo: |
  [bold #E6E8FF]⚔  D E A T H   K N I G H T  ⚔[/]
  [#7F84C9]the frost never forgets[/]

