#kate ~/.hermes/skins/deathknight.yaml
#hermes config set display.skin deathknight


name: deathknight
description: Death Knight — light indigo theme

colors:
  banner_border:   "#C7CAFF"   # light indigo banner border
  banner_title:    "#E6E8FF"
  banner_accent:   "#D3D6FF"
  banner_dim:      "#A9ADE8"
  banner_text:     "#F2F3FF"
  ui_accent:       "#E6E8FF"
  ui_label:        "#D3D6FF"
  ui_ok:           "#B9E8C8"
  ui_error:        "#FFB3B8"
  ui_warn:         "#FFDDA8"
  prompt:          "#F2F3FF"
  input_rule:      "#12131a"   # hidden: match your terminal background
  response_border: "#12131a"   # hidden: match your terminal background
  session_label:   "#D3D6FF"
  session_border:  "#12131a"   # hidden: match your terminal background
  status_bar_bg:   "#0f1030"
  completion_menu_bg:          "#0f1030"
  completion_menu_current_bg:  "#2a2d6b"

branding:
  agent_name:     "Death Knight"
  welcome:        "Death Knight online. Type your command."
  goodbye:        "Dismissed."
  response_label: " Death Knight "
  prompt_symbol:  "❯"
  help_header:    "Available Commands"

spinner:
  thinking_verbs:
    - "reaping"
    - "executing"
    - "summoning"
    - "calculating damage"
  wings:
    - ["<", ">"]

